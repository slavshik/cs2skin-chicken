<!doctype html>
<html data-theme="night">
    <head>
        <link rel="stylesheet" href="../tokens.css" />
        <link rel="stylesheet" href="../components.css" />
        <meta charset="utf-8" />
        <title>BetInput — preview</title>
    </head>
    <body>
        <div class="ccr-col" style="width: 303px">
            <div class="ccr-field">
                <label class="ccr-label">Bet Amount <b class="ccr-num">$12.50</b></label>
                <div class="ccr-input">
                    <span class="ccr-coin"></span><input value="12.50" />
                    <button class="ccr-chip">1/2</button><button class="ccr-chip">2x</button
                    ><button class="ccr-chip">Max</button>
                </div>
            </div>
            <div class="ccr-field">
                <label class="ccr-label">Focused</label>
                <div class="ccr-input ccr-input--focus">
                    <span class="ccr-coin"></span><input value="100" />
                    <button class="ccr-chip">1/2</button><button class="ccr-chip">2x</button
                    ><button class="ccr-chip">Max</button>
                </div>
            </div>
        </div>
    </body>
</html>
