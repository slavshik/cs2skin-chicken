<!doctype html>
<html data-theme="night">
    <head>
        <link rel="stylesheet" href="../tokens.css" />
        <link rel="stylesheet" href="../components.css" />
        <meta charset="utf-8" />
        <title>DifficultySelector — preview</title>
    </head>
    <body>
        <div class="ccr-col" style="width: 303px">
            <label class="ccr-label">Difficulty <b>24 lanes · 1 car / 25</b></label>
            <div class="ccr-seg" role="group" aria-label="Difficulty">
                <button class="ccr-seg__opt" aria-pressed="true">Easy</button>
                <button class="ccr-seg__opt" aria-pressed="false">Medium</button>
                <button class="ccr-seg__opt" aria-pressed="false">Hard</button>
                <button class="ccr-seg__opt" aria-pressed="false" disabled>Hardcore</button>
            </div>
        </div>
    </body>
</html>
