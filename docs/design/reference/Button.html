<!doctype html>
<html data-theme="night">
    <head>
        <link rel="stylesheet" href="../tokens.css" />
        <link rel="stylesheet" href="../components.css" />
        <meta charset="utf-8" />
        <title>Button — preview</title>
    </head>
    <body>
        <div class="ccr-col">
            <div class="ccr-row" style="padding: 0">
                <button class="ccr-btn ccr-btn--primary">Place Bet</button>
                <button class="ccr-btn ccr-btn--cashout">
                    <span>Cash Out</span><span class="ccr-btn__sub ccr-num">x2.47</span>
                </button>
                <button class="ccr-btn ccr-btn--primary ccr-btn--sm">Go</button>
                <button class="ccr-btn ccr-btn--ghost ccr-btn--sm">Login</button>
            </div>
            <div class="ccr-row" style="padding: 0">
                <button class="ccr-btn ccr-btn--idle" style="width: 303px">Start Game</button>
                <button class="ccr-btn ccr-btn--primary" disabled>Disabled</button>
            </div>
        </div>
    </body>
</html>
