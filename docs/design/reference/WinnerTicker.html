<!doctype html>
<html data-theme="night">
    <head>
        <link rel="stylesheet" href="../tokens.css" />
        <link rel="stylesheet" href="../components.css" />
        <meta charset="utf-8" />
        <title>WinnerTicker — preview</title>
    </head>
    <body>
        <div class="ccr-ticker" style="padding: var(--space-400)">
            <div class="ccr-win ccr-win--violet">
                <div class="ccr-win__icon">
                    <span class="ccr-chicken" style="transform: scale(0.55)"></span>
                </div>
                <div style="min-width: 0">
                    <div class="ccr-win__name">lordcharlesz</div>
                    <div class="ccr-win__amt"><span class="ccr-coin"></span>48.20</div>
                </div>
            </div>
            <div class="ccr-win ccr-win--blue">
                <div class="ccr-win__icon">
                    <span class="ccr-chicken" style="transform: scale(0.55)"></span>
                </div>
                <div style="min-width: 0">
                    <div class="ccr-win__name">peace_x</div>
                    <div class="ccr-win__amt"><span class="ccr-coin"></span>292.50</div>
                </div>
            </div>
            <div class="ccr-win ccr-win--magenta">
                <div class="ccr-win__icon">
                    <span class="ccr-chicken" style="transform: scale(0.55)"></span>
                </div>
                <div style="min-width: 0">
                    <div class="ccr-win__name">vikas</div>
                    <div class="ccr-win__amt"><span class="ccr-coin"></span>0.36</div>
                </div>
            </div>
            <div class="ccr-win ccr-win--orange">
                <div class="ccr-win__icon">
                    <span class="ccr-chicken" style="transform: scale(0.55)"></span>
                </div>
                <div style="min-width: 0">
                    <div class="ccr-win__name">jhondapt</div>
                    <div class="ccr-win__amt"><span class="ccr-coin"></span>1,350.25</div>
                </div>
            </div>
        </div>
    </body>
</html>
