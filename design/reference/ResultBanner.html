<!doctype html>
<html data-theme="night">
    <head>
        <link rel="stylesheet" href="../tokens.css" />
        <link rel="stylesheet" href="../components.css" />
        <meta charset="utf-8" />
        <title>ResultBanner — preview</title>
    </head>
    <body>
        <div class="ccr-row" style="align-items: stretch">
            <div class="ccr-result ccr-result--win">
                <div class="ccr-result__title">Cashed Out</div>
                <div class="ccr-result__value">x2.47</div>
                <div class="ccr-result__sub"><span class="ccr-coin"></span>+30.88</div>
            </div>
            <div class="ccr-result ccr-result--lose">
                <div class="ccr-result__title">Splat</div>
                <div class="ccr-result__value">x0.00</div>
                <div class="ccr-result__sub">Lane 4 · −12.50</div>
            </div>
        </div>
    </body>
</html>
