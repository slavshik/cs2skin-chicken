<!doctype html>
<html data-theme="night">
    <head>
        <link rel="stylesheet" href="../tokens.css" />
        <link rel="stylesheet" href="../components.css" />
        <meta charset="utf-8" />
        <title>Lane — preview</title>
    </head>
    <body>
        <div style="padding: var(--space-400)">
            <div class="ccr-board">
                <div class="ccr-curb"></div>
                <div class="ccr-lane">
                    <div class="ccr-barrier"></div>
                    <div class="ccr-coin-lg"></div>
                </div>
                <div class="ccr-lane">
                    <div class="ccr-barrier"></div>
                    <div class="ccr-chicken" style="transform: scale(1.5)"></div>
                    <span
                        class="ccr-mult ccr-mult--live ccr-lane__label"
                        style="margin-top: var(--space-400)"
                        >x1.09</span
                    >
                </div>
                <div class="ccr-lane ccr-lane--next">
                    <div class="ccr-hole"><span>x1.15</span></div>
                </div>
                <div class="ccr-lane">
                    <div class="ccr-car" style="top: -20px; background: var(--car-blue)"></div>
                    <div class="ccr-hole"><span>x1.21</span></div>
                </div>
                <div class="ccr-lane">
                    <div class="ccr-hole"><span>x1.28</span></div>
                </div>
                <span class="ccr-badge-lane">Lane 2</span>
            </div>
        </div>
    </body>
</html>
