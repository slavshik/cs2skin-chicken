<!doctype html>
<html data-theme="night">
    <head>
        <link rel="stylesheet" href="../tokens.css" />
        <link rel="stylesheet" href="../components.css" />
        <meta charset="utf-8" />
        <title>GameTile — preview</title>
    </head>
    <body>
        <div class="ccr-row">
            <div class="ccr-tile ccr-tile--green">
                <div class="ccr-tile__art">
                    <div class="ccr-chicken" style="transform: scale(1.4); margin: 8px"></div>
                </div>
                <div class="ccr-tile__title">Chicken</div>
                <div class="ccr-tile__sub">Cross the road</div>
            </div>
            <div class="ccr-tile ccr-tile--violet">
                <div class="ccr-tile__title">Keno</div>
                <div class="ccr-tile__sub">How far can you go?</div>
            </div>
            <div class="ccr-tile ccr-tile--red">
                <div class="ccr-tile__title">Mines</div>
                <div class="ccr-tile__sub">Dodge the bombs</div>
            </div>
            <div class="ccr-tile ccr-tile--gold">
                <div class="ccr-tile__title">Royale</div>
                <div class="ccr-tile__sub">Tournament</div>
            </div>
        </div>
    </body>
</html>
